<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twój Autobus - Rejestracja</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/simple.css">
    <script src="../assets/javascript/layout.js" data-asset-root="../" data-link-root="" data-page="register" defer></script>
    <script src="../assets/javascript/api.js" defer></script>
    <script src="../assets/javascript/register.js" defer></script>
</head>
<body>
    <div data-site-header></div>
    <main class="container">
        <h1>Rejestracja</h1>
        <form id="register-form" class="basic-form">
            <label for="name">Imię i nazwisko</label>
            <input id="name" type="text" autocomplete="name" minlength="2" maxlength="100" required>
            <label for="email">Adres e-mail</label>
            <input id="email" type="email" autocomplete="email" required>
            <label for="password">Hasło, minimum 8 znaków</label>
            <input id="password" type="password" autocomplete="new-password" minlength="8" required>
            <label for="birthdate">Data urodzenia (opcjonalnie)</label>
            <input id="birthdate" type="date">
            <button type="submit">Utwórz konto</button>
            <p id="register-message" class="message" role="status"></p>
        </form>
        <p>Masz już konto? <a href="login.html">Zaloguj się</a>.</p>
    </main>
    <div data-site-footer></div>
</body>
</html>
