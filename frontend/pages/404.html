<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f8ff">
    <title>Nie znaleziono strony (404) | Twój Autobus</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/404.css">
    <script src="../assets/javascript/layout.js" data-asset-root="../" data-link-root="" data-page="404" defer></script>
    <script src="../assets/javascript/404.js" defer></script>
</head>
<body>
    <div data-site-header></div>

    <main>
        <section class="notfound-page" id="notfoundPage">
            <div class="notfound-bg" aria-hidden="true">
                <span class="bg-circle bg-circle--one"></span>
                <span class="bg-circle bg-circle--two"></span>
                <span class="bg-circle bg-circle--three"></span>
                <span class="bg-grid"></span>
            </div>

            <div class="container notfound-container">
                <div class="notfound-content">
                    <div class="notfound-brand" aria-label="Twój Autobus">
                        <span class="brand-dot"></span>
                        Twój Autobus
                    </div>

                    <div class="error-code" aria-label="Błąd 404">
                        <span>4</span><span>0</span><span>4</span>
                    </div>

                    <div class="notfound-label">Błąd 404</div>
                    <h1>Podstrona <span>nie istnieje.</span></h1>
                    <p class="notfound-description">
                        Strona, której szukasz, mogła zostać przeniesiona albo adres jest nieprawidłowy.
                    </p>

                    <div class="notfound-actions">
                        <a href="home.html" class="btn btn-primary">Wróć na stronę główną</a>
                    </div>

                    <nav class="quick-links" aria-label="Przydatne strony">
                        <a class="quick-link" href="map.html">Mapa przystanków</a>
                        <a class="quick-link" href="wyniki.html">Wyniki wyszukiwania</a>
                    </nav>
                </div>

                <div class="notfound-visual" aria-hidden="true">
                    <div class="visual-glow"></div>
                    <div class="visual-card">
                        <div class="visual-card-top">
                            <span class="visual-dot"></span><span class="visual-dot"></span><span class="visual-dot"></span>
                        </div>
                        <div class="visual-card-body">
                            <div class="visual-error-number">404</div>
                            <div class="visual-route">
                                <span class="route-point route-point--active"></span>
                                <span class="route-line"><span class="route-line-progress"></span></span>
                                <span class="route-point"></span>
                            </div>
                            <div class="visual-message">
                                <strong>Brak podstrony</strong>
                                <span>Nie znaleziono wskazanego adresu</span>
                            </div>
                        </div>
                    </div>
                    <div class="floating-symbol floating-symbol--one">?</div>
                    <div class="floating-symbol floating-symbol--two">404</div>
                    <div class="floating-symbol floating-symbol--three">×</div>
                </div>
            </div>
        </section>
    </main>

    <div data-site-footer></div>
</body>
</html>
