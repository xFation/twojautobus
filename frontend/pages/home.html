<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twój Autobus | Plan podróży</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/simple.css">
    <link rel="stylesheet" href="../assets/css/home.css">
    <script src="../assets/javascript/layout.js" data-asset-root="../" data-link-root="" data-page="home" defer></script>
    <script src="../assets/javascript/api.js" defer></script>
    <script src="../assets/javascript/home.js" defer></script>
</head>
<body>
    <div data-site-header></div>

    <main id="top" class="page-shell">
        <section class="intro" aria-labelledby="page-title">
            <p class="eyebrow">PODRÓŻ ZACZYNA SIĘ TUTAJ</p>
            <h1 id="page-title">Dokąd dziś <span>jedziesz?</span></h1>
            <p class="intro-copy">Wybierz przewoźnika i przystanki. Znajdziemy dostępne połączenia.</p>
            <span class="network-status" id="api-status" role="status">
                <span class="status-dot" aria-hidden="true"></span>
                Łączenie z API...
            </span>
        </section>

        <section class="planner" aria-label="Wyszukiwarka połączeń">
            <form id="route-form" novalidate>
                <div class="form-topline">
                    <label class="field provider-field" for="provider-select">
                        <span class="field-label">PRZEWOŹNIK</span>
                        <select id="provider-select" name="provider" required disabled>
                            <option value="">Ładowanie przewoźników...</option>
                        </select>
                    </label>
                    <label class="field time-field" for="departure-time">
                        <span class="field-label">ODJAZD PO</span>
                        <input id="departure-time" name="departure-time" type="time">
                    </label>
                </div>

                <div class="journey-fields">
                    <label class="field stop-field" for="from-stop">
                        <span class="field-label">PRZYSTANEK POCZĄTKOWY</span>
                        <span class="input-wrap">
                            <span class="stop-marker marker-start" aria-hidden="true"></span>
                            <input id="from-stop" name="from-stop" type="text" placeholder="Wpisz nazwę przystanku" autocomplete="off" required aria-autocomplete="list" aria-controls="from-suggestions">
                        </span>
                        <span class="suggestions" id="from-suggestions" role="listbox" hidden></span>
                    </label>

                    <button class="swap-button" id="swap-stops" type="button" aria-label="Zamień przystanki" title="Zamień przystanki">
                        <span aria-hidden="true">&#8645;</span>
                    </button>

                    <label class="field stop-field" for="to-stop">
                        <span class="field-label">PRZYSTANEK KOŃCOWY</span>
                        <span class="input-wrap">
                            <span class="stop-marker marker-end" aria-hidden="true"></span>
                            <input id="to-stop" name="to-stop" type="text" placeholder="Dokąd chcesz dojechać?" autocomplete="off" required aria-autocomplete="list" aria-controls="to-suggestions">
                        </span>
                        <span class="suggestions" id="to-suggestions" role="listbox" hidden></span>
                    </label>
                </div>

                <div class="form-bottomline">
                    <label class="transfers-field" for="max-transfers">
                        <span>Przesiadki</span>
                        <select id="max-transfers" name="max-transfers">
                            <option value="0">Bez przesiadki</option>
                            <option value="1" selected>Maksymalnie 1</option>
                        </select>
                    </label>
                    <button class="search-button" id="search-button" type="submit">
                        <span class="button-icon" aria-hidden="true">&#8594;</span>
                        <span>Szukaj połączeń</span>
                    </button>
                </div>
                <p class="form-error" id="form-error" role="alert" hidden></p>
            </form>
        </section>

        <section class="results-section" aria-live="polite" aria-busy="false">
            <div class="results-heading">
                <div>
                    <p class="eyebrow">PLAN PODRÓŻY</p>
                    <h2 id="results-title">Połączenia</h2>
                </div>
                <span class="result-count" id="result-count"></span>
            </div>
            <div id="results" class="results-list">
                <div class="empty-state" id="empty-state">
                    <span class="empty-icon" aria-hidden="true">&#8594;</span>
                    <p>Wybierz trasę, aby zobaczyć dostępne połączenia.</p>
                </div>
            </div>
        </section>
    </main>

    <div data-site-footer></div>
</body>
</html>
