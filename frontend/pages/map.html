<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twój Autobus - Mapa przystanków</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/simple.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="../assets/javascript/layout.js" data-asset-root="../" data-link-root="" data-page="map" defer></script>
    <script src="../assets/javascript/api.js" defer></script>
    <script src="../assets/javascript/map.js" defer></script>
</head>
<body>
    <div data-site-header></div>
    <main class="container">
        <h1>Mapa przystanków</h1>
        <p>Wybierz przewoźnika, aby wyświetlić jego przystanki na mapie.</p>
        <div class="map-controls">
            <label for="map-provider">Przewoźnik
                <select id="map-provider"><option value="">Ładowanie przewoźników...</option></select>
            </label>
            <span id="map-message" class="muted" role="status">Wybierz przewoźnika.</span>
        </div>
        <div id="map" aria-label="Mapa OpenStreetMap z przystankami"></div>
        <p class="muted">Mapa: © OpenStreetMap contributors. Kliknij marker, aby zobaczyć nazwę przystanku.</p>
    </main>
    <div data-site-footer></div>
</body>
</html>
