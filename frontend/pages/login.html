<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twój Autobus - Logowanie</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/simple.css">
    <script src="../assets/javascript/layout.js" data-asset-root="../" data-link-root="" data-page="login" defer></script>
    <script src="../assets/javascript/api.js" defer></script>
    <script src="../assets/javascript/login.js" defer></script>
</head>
<body>
    <div data-site-header></div>
    <main class="container">
        <h1>Logowanie</h1>
        <form id="login-form" class="basic-form">
            <label for="email">Adres e-mail</label>
            <input id="email" type="email" autocomplete="email" required>
            <label for="password">Hasło</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <button type="submit">Zaloguj</button>
            <p id="login-message" class="message" role="status"></p>
        </form>
        <p>Nie masz konta? <a href="register.html">Zarejestruj się</a>.</p>
    </main>
    <div data-site-footer></div>
</body>
</html>
